name: informatica

# El código está en la rama «radar-informatico». Este archivo vive en la rama por defecto
# porque GitHub solo lanza (a mano, por cron-job.org o por horario) los flujos de esa rama.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "Qué hacer"
        type: choice
        options: [resumen, prueba, diagnostico]
        default: resumen
  schedule:
    - cron: "5 15 * * *"    # respaldo: 16:05 en invierno (17:05 en verano); solo sale si hoy no salió
    - cron: "40 15 * * *"

permissions:
  contents: write

concurrency:
  group: informatica
  cancel-in-progress: false

jobs:
  informatica:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MODO: ${{ inputs.modo || 'resumen' }}
      GH_TOKEN: ${{ github.token }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SUPER_IA_URL: ${{ secrets.SUPER_IA_URL }}
      SUPER_IA_KEY: ${{ secrets.SUPER_IA_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radar-informatico

      - name: Traer el estado (rama «estado-informatica»)
        run: |
          REMOTO="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          set +e
          git ls-remote --exit-code --heads "$REMOTO" estado-informatica >/dev/null 2>&1
          codigo=$?
          set -e
          if [ "$codigo" = 0 ]; then
            git clone -q --depth 1 --branch estado-informatica "$REMOTO" _estado_info
          elif [ "$codigo" = 2 ]; then
            mkdir -p _estado_info && git -C _estado_info init -q -b estado-informatica && git -C _estado_info remote add origin "$REMOTO"
          else
            echo "::error::No se pudo leer la rama «estado-informatica» (código $codigo)"
            exit 1
          fi

      - name: Radar de informática
        timeout-minutes: 9
        run: python3 -m radar.informatica "$MODO" --estado _estado_info/informatica.json

      - name: Guardar el estado
        if: always() && env.MODO == 'resumen'
        run: |
          cd _estado_info
          [ -f informatica.json ] || exit 0
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add informatica.json
          if git rev-parse -q --verify HEAD >/dev/null; then
            git diff --cached --quiet && exit 0
            git commit -q --amend -m "estado"
          else
            git commit -q -m "estado"
          fi
          for i in 1 2 3 4 5; do
            git push -q -f origin estado-informatica && exit 0
            sleep $((i * 5))
          done
          exit 1
