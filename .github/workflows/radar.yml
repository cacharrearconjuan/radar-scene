name: radar

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "Qué hacer"
        type: choice
        options: [ronda, prueba, diagnostico, resumen, repetir_resumen]
        default: ronda
  schedule:
    - cron: "7,22,37,52 * * * *"   # respaldo por si cron-job.org falla

permissions:
  contents: write

# Las rondas no se solapan. «prueba» y «diagnostico» van aparte (no tocan el estado),
# para que una ronda de cron-job.org no cancele una prueba manual en espera.
concurrency:
  group: ${{ (inputs.modo == 'prueba' || inputs.modo == 'diagnostico') && 'radar-manual' || 'radar' }}
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      MODO: ${{ inputs.modo || 'ronda' }}
      GH_TOKEN: ${{ github.token }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SUPER_IA_URL: ${{ secrets.SUPER_IA_URL }}
      SUPER_IA_KEY: ${{ secrets.SUPER_IA_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Traer el estado (rama «estado»)
        run: |
          REMOTO="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          set +e
          git ls-remote --exit-code --heads "$REMOTO" estado >/dev/null 2>&1
          codigo=$?
          set -e
          if [ "$codigo" = 0 ]; then
            git clone -q --depth 1 --branch estado "$REMOTO" _estado
          elif [ "$codigo" = 2 ]; then
            echo "No hay rama «estado»: se empieza de cero"
            mkdir -p _estado && git -C _estado init -q -b estado && git -C _estado remote add origin "$REMOTO"
          else
            echo "::error::No se pudo leer la rama «estado» (código $codigo). No sigo para no perder el estado."
            exit 1
          fi

      - name: Radar
        timeout-minutes: 11         # deja tiempo a «Guardar el estado»
        run: python3 -m radar "$MODO" --estado _estado/estado.json

      - name: Guardar el estado
        if: always() && env.MODO != 'prueba' && env.MODO != 'diagnostico'
        run: |
          cd _estado
          [ -f estado.json ] || exit 0
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add estado.json
          if git rev-parse -q --verify HEAD >/dev/null; then
            git diff --cached --quiet && exit 0
            git commit -q --amend -m "estado"
          else
            git commit -q -m "estado"
          fi
          for i in 1 2 3 4 5; do
            git push -q -f origin estado && exit 0
            echo "push falló (intento $i); reintento"
            sleep $((i * 5))
          done
          echo "::error::No se pudo guardar el estado"
          exit 1
